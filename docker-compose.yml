version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webappdb
      MYSQL_USER: webappuser
      MYSQL_PASSWORD: StrongPassword123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  app-tier:
    build: ./app-tier
    restart: on-failure
    environment:
      DB_HOST: db
      DB_USER: webappuser
      DB_PWD: StrongPassword123!
      DB_DATABASE: webappdb
    depends_on:
      - db
    networks:
      - app-network

  web-tier:
    build: ./web-tier
    ports:
      - "80:80"
    depends_on:
      - app-tier
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
